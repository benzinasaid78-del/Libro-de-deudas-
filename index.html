<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locutorio Rachida - Deudas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Lora:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --paper2: #ede8dc;
    --accent: #c0392b;
    --accent2: #e74c3c;
    --gold: #d4a017;
    --green: #27ae60;
    --blue: #2980b9;
    --muted: #7f8c8d;
    --border: #c8bfad;
    --shadow: rgba(26,26,46,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    direction: ltr;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(200,191,173,0.3) 28px),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8bfad' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--ink);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px var(--shadow);
  }
  .app-header h1 {
    font-family: 'Lora', serif;
    font-size: 1.4rem;
    font-weight: 700;
    font-style: italic;
    letter-spacing: 0.2px;
  }
  .app-header h1 span { color: var(--gold); }
  .header-date {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    font-family: 'Inter', sans-serif;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 14px 16px;
    background: var(--paper2);
    border-bottom: 2px solid var(--border);
  }
  .stat-card {
    background: white;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px var(--shadow);
  }
  .stat-card .val {
    font-size: 1.2rem;
    font-weight: 900;
    line-height: 1.1;
  }
  .stat-card .lbl {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 2px;
    font-family: 'Inter', sans-serif;
  }
  .stat-card.danger .val { color: var(--accent); }
  .stat-card.success .val { color: var(--green); }
  .stat-card.info .val { color: var(--blue); }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: var(--paper2);
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
  }
  .tab-btn {
    flex: 1;
    padding: 12px 8px;
    border: none;
    background: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: white;
  }
  .tab-btn .tab-icon { display: block; font-size: 1.2rem; margin-bottom: 2px; }

  /* ── CONTENT ── */
  .tab-panel { display: none; padding: 16px; }
  .tab-panel.active { display: block; }

  /* ── SECTION TITLE ── */
  .section-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── FORM ── */
  .form-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .form-row.full { grid-template-columns: 1fr; }
  .form-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 4px;
    font-family: 'Inter', sans-serif;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    background: var(--paper);
    color: var(--ink);
    transition: border-color 0.2s;
    direction: ltr;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }

  /* ── BUTTONS ── */
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
    width: 100%;
    justify-content: center;
    padding: 12px;
    font-size: 0.95rem;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-success { background: var(--green); color: white; }
  .btn-blue { background: var(--blue); color: white; }
  .btn-ghost {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--ink);
    padding: 6px 12px;
    font-size: 0.78rem;
  }
  .btn-danger { background: var(--accent); color: white; padding: 6px 12px; font-size: 0.78rem; }

  /* ── TRANSACTION CARD ── */
  .tx-list { display: flex; flex-direction: column; gap: 10px; }
  .tx-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    box-shadow: 0 1px 4px var(--shadow);
    position: relative;
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tx-card::before {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 4px;
  }
  .tx-card.debt::before { background: var(--accent); }
  .tx-card.credit::before { background: var(--green); }
  .tx-card.service::before { background: var(--blue); }
  .tx-card.paid::before { background: #bdc3c7; }

  .tx-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .tx-name { font-size: 0.95rem; font-weight: 700; }
  .tx-type-badge {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    font-family: 'Inter', sans-serif;
  }
  .badge-debt { background: #fde8e8; color: var(--accent); }
  .badge-credit { background: #e8f8ee; color: var(--green); }
  .badge-service { background: #e8f0f8; color: var(--blue); }
  .badge-digital { background: #f0e8f8; color: #8e44ad; }
  .badge-paid { background: #eee; color: var(--muted); }
  .tx-card.digital::before { background: #8e44ad; }

  .tx-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    font-size: 0.78rem;
    margin-bottom: 8px;
  }
  .tx-detail-item { display: flex; flex-direction: column; gap: 1px; }
  .tx-detail-item .key { color: var(--muted); font-family: 'Inter', sans-serif; }
  .tx-detail-item .val { font-weight: 600; }
  .val.amount-owed { color: var(--accent); font-size: 0.9rem; }
  .val.amount-paid { color: var(--green); }

  .tx-note {
    font-size: 0.78rem;
    color: var(--muted);
    font-style: italic;
    border-top: 1px dashed var(--border);
    padding-top: 6px;
    margin-bottom: 6px;
  }

  .tx-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-top: 1px solid var(--paper2);
    padding-top: 8px;
  }

  /* OVERDUE */
  .tx-card.overdue {
    border-color: #f5c6c6;
    background: #fff8f8;
  }
  .overdue-tag {
    font-size: 0.65rem;
    color: var(--accent);
    font-weight: 700;
    background: #fde8e8;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Inter', sans-serif;
  }

  /* ── MONEY TRANSFER FORM ── */
  .transfer-card {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(26,26,46,0.3);
  }
  .transfer-card label { color: rgba(255,255,255,0.7); }
  .transfer-card input, .transfer-card select {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
  }
  .transfer-card input::placeholder { color: rgba(255,255,255,0.4); }
  .transfer-card input:focus, .transfer-card select:focus {
    background: rgba(255,255,255,0.15);
    border-color: var(--gold);
  }
  .transfer-card select option { background: #1a1a2e; }
  .transfer-card .section-title { color: white; }
  .transfer-card .section-title::after { background: rgba(255,255,255,0.2); }
  .fee-display {
    background: rgba(212,160,23,0.15);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .fee-display .fee-label { font-size: 0.8rem; color: rgba(255,255,255,0.7); font-family: 'Inter', sans-serif; }
  .fee-display .fee-val { font-size: 1.1rem; font-weight: 900; color: var(--gold); }

  /* ── HISTORY LIST ── */
  .history-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .history-item .hi-left .hi-title { font-size: 0.85rem; font-weight: 700; }
  .history-item .hi-left .hi-sub { font-size: 0.72rem; color: var(--muted); font-family: 'Inter', sans-serif; }
  .history-item .hi-right { text-align: left; }
  .history-item .hi-amount { font-size: 0.95rem; font-weight: 900; }
  .history-item .hi-date { font-size: 0.68rem; color: var(--muted); font-family: 'Inter', sans-serif; }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .empty-state .empty-icon { font-size: 3rem; margin-bottom: 8px; }
  .empty-state p { font-size: 0.85rem; font-family: 'Inter', sans-serif; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open, .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 32px;
    width: 100%;
    max-width: 480px;
    animation: slideUp 0.3s ease;
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title {
    font-size: 1.1rem;
    font-weight: 900;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-close {
    background: var(--paper2);
    border: none;
    border-radius: 50%;
    width: 30px; height: 30px;
    cursor: pointer;
    font-size: 1rem;
  }

  /* ── SEARCH ── */
  .search-box {
    position: relative;
    margin-bottom: 14px;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    background: white;
    direction: ltr;
  }
  .search-box input:focus { outline: none; border-color: var(--accent); }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* ── FILTER PILLS ── */
  .filter-pills {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .pill {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: white;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s;
  }
  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 0.85rem;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    z-index: 300;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── SUMMARY ROW ── */
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 0.85rem;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .s-label { color: var(--muted); font-family: 'Inter', sans-serif; }
  .summary-row .s-val { font-weight: 700; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="app-header">
  <div>
    <h1>Locutorio Rachida <span>Deudas</span></h1>
    <div class="header-date" id="headerDate"></div>
  </div>
  <div style="text-align:right">
    <div style="font-size:0.7rem;color:rgba(255,255,255,0.5);font-family:'Inter',sans-serif">Total pendiente</div>
    <div style="font-size:1.1rem;font-weight:900;color:#e74c3c" id="headerTotal">0 €</div>
  </div>
</div>

<!-- STATS -->
<div class="stats-bar">
  <div class="stat-card danger">
    <div class="val" id="statDebt">0</div>
    <div class="lbl">Pendientes</div>
  </div>
  <div class="stat-card success">
    <div class="val" id="statPaid">0</div>
    <div class="lbl">Pagadas</div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('debts')">
    <span class="tab-icon">📋</span>Deudas
  </button>
  <button class="tab-btn" onclick="switchTab('add')">
    <span class="tab-icon">➕</span>Añadir
  </button>
  <button class="tab-btn" onclick="switchTab('history')">
    <span class="tab-icon">📜</span>Historial
  </button>
</div>

<!-- TAB: DEBTS LIST -->
<div class="tab-panel active" id="tab-debts">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Buscar por nombre..." id="searchInput" oninput="renderDebts()">
  </div>
  <div class="filter-pills">
    <button class="pill active" onclick="setFilter('all', this)">Todos</button>
    <button class="pill" onclick="setFilter('debt', this)">Sin pagar</button>
    <button class="pill" onclick="setFilter('overdue', this)">Atrasado</button>
    <button class="pill" onclick="setFilter('paid', this)">Pagado</button>
    <button class="pill" onclick="setFilter('service', this)">Servicios</button>
  </div>
  <div class="tx-list" id="debtList"></div>
</div>

<!-- TAB: ADD -->
<div class="tab-panel" id="tab-add">
  <div class="section-title">📋 Registrar nueva operación</div>
  <div class="form-card">
    <div class="form-row">
      <div class="form-group">
        <label>Nombre del cliente *</label>
        <input type="text" id="addName" placeholder="Ej: Mohamed Ahmed">
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" id="addPhone" placeholder="0600000000">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo de operación *</label>
        <select id="addType" onchange="toggleTypeFields()">
          <option value="debt">Mercancía / Préstamo</option>
          <option value="service">Servicio (envío de dinero...)</option>
          <option value="digital">💻 Servicio digital (CV, escáner...)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Importe total (€) *</label>
        <input type="number" id="addAmount" placeholder="0.00" step="0.01" min="0" oninput="calcBalance()">
      </div>
    </div>
    <div class="form-row" id="paidRow">
      <div class="form-group">
        <label>Pago inicial (€)</label>
        <input type="number" id="addPaid" placeholder="0.00" step="0.01" min="0" value="0" oninput="calcBalance()">
      </div>
      <div class="form-group">
        <label>Pendiente (€)</label>
        <input type="number" id="addRemaining" placeholder="0.00" readonly style="background:#fff0f0;font-weight:700;color:var(--accent)">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Fecha de operación</label>
        <input type="date" id="addDate">
      </div>
      <div class="form-group">
        <label>Fecha de vencimiento</label>
        <input type="date" id="addDueDate">
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>Detalles / Nota</label>
        <textarea id="addNote" placeholder="Ej: Samsung A54 + protector de pantalla..."></textarea>
      </div>
    </div>
    <button class="btn btn-primary" onclick="addTransaction()">💾 Guardar operación</button>
  </div>
</div>

<!-- TAB: HISTORY -->
<div class="tab-panel" id="tab-history">
  <div class="section-title">📜 Historial completo</div>
  <div class="form-card" style="padding:12px">
    <div class="summary-row">
      <span class="s-label">Total deudas pendientes</span>
      <span class="s-val" style="color:var(--accent)" id="sumDebt">0 €</span>
    </div>
    <div class="summary-row">
      <span class="s-label">Total cobrado</span>
      <span class="s-val" style="color:var(--green)" id="sumPaid">0 €</span>
    </div>
    <div class="summary-row" style="border-top:2px solid var(--border);padding-top:8px;margin-top:4px">
      <span class="s-label" style="font-weight:700">Total general</span>
      <span class="s-val" style="font-size:1rem" id="sumTotal">0 €</span>
    </div>
  </div>
  <div class="tx-list" id="historyList"></div>
</div>

<!-- MODAL: EDIT TRANSACTION -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">
      ✏️ Editar operación
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <input type="hidden" id="editTxId">
    <div class="form-row">
      <div class="form-group">
        <label>Nombre del cliente *</label>
        <input type="text" id="editName" placeholder="Nombre completo">
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" id="editPhone" placeholder="600000000">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo de operación *</label>
        <select id="editType">
          <option value="debt">Mercancía / Préstamo</option>
          <option value="service">🔧 Servicio (envío de dinero...)</option>
          <option value="digital">💻 Servicio digital (CV, escáner...)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Importe total (€) *</label>
        <input type="number" id="editAmount" placeholder="0.00" step="0.01" min="0" oninput="recalcEditRemaining()">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Ya pagado (€)</label>
        <input type="number" id="editPaid" placeholder="0.00" step="0.01" min="0" oninput="recalcEditRemaining()">
      </div>
      <div class="form-group">
        <label>Pendiente (€)</label>
        <input type="number" id="editRemaining" placeholder="0.00" readonly style="background:#fff0f0;font-weight:700;color:var(--accent)">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Fecha de operación</label>
        <input type="date" id="editDate">
      </div>
      <div class="form-group">
        <label>Fecha de vencimiento</label>
        <input type="date" id="editDueDate">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label>Nota</label>
      <textarea id="editNote" placeholder="Detalles adicionales..." style="width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:0.88rem;background:var(--paper);direction:ltr;resize:vertical;min-height:60px"></textarea>
    </div>
    <button class="btn btn-primary" onclick="confirmEdit()">💾 Guardar cambios</button>
  </div>
</div>

<!-- MODAL: PARTIAL PAYMENT -->
<div class="modal-overlay" id="payModal">
  <div class="modal">
    <div class="modal-title">
      💰 Registrar pago
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <input type="hidden" id="payTxId">
    <div class="form-group" style="margin-bottom:12px">
      <label>Nombre del cliente</label>
      <input type="text" id="payName" readonly style="background:var(--paper2)">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Pendiente</label>
        <input type="number" id="payOwed" readonly style="background:#fff0f0;color:var(--accent);font-weight:700">
      </div>
      <div class="form-group">
        <label>Importe pagado ahora *</label>
        <input type="number" id="payAmount" placeholder="0.00" step="0.01" min="0" autofocus>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label>Nota</label>
      <input type="text" id="payNote" placeholder="Ej: pagó la mitad...">
    </div>
    <button class="btn btn-success" style="width:100%;justify-content:center;padding:12px;font-size:0.95rem" onclick="confirmPayment()">✅ Confirmar pago</button>
  </div>
</div>

<!-- LOADING OVERLAY -->
<div id="loadingOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:400;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <div style="width:44px;height:44px;border:4px solid rgba(255,255,255,0.2);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite"></div>
  <div style="color:white;font-family:'Inter',sans-serif;font-size:0.9rem">Cargando...</div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<div class="toast" id="toast"></div>

<!-- ── FIREBASE SDK (compat, works with plain <script> tags) ── -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // ── FIREBASE CONFIG ───────────────────────────────────────────
  // ⚠️ Reemplaza estos valores por los de TU proyecto Firebase
  // (Firebase Console → ⚙️ Project settings → General → "Your apps" → SDK setup and configuration)
  const firebaseConfig = {
    apiKey: "AIzaSyC-ll-f6EOUiFevJXsDAacSfNrsXFSDqmc",
    authDomain: "libro-de-deudas-ee91e.firebaseapp.com",
    projectId: "libro-de-deudas-ee91e",
    storageBucket: "libro-de-deudas-ee91e.firebasestorage.app",
    messagingSenderId: "546384341637",
    appId: "1:546384341637:web:c31996b4fc7d2bfb2057ec"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const txCol = db.collection('transactions');

  // Convierte errores de red/permiso en mensajes claros, igual que antes
  function handleDbError(e) {
    console.error(e);
    if (e && e.code === 'permission-denied') {
      showToast('❌ Error de permisos en Firestore (revisa las reglas)');
    } else {
      showToast('❌ Error de conexión con la base de datos');
    }
    throw e;
  }

  // ── DATA ──────────────────────────────────────────────────────
  let transactions = [];
  let currentFilter = 'all';
  let isLoading = false;

  // ── HELPERS ──────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const fmt = n => parseFloat(n||0).toFixed(2);
  const today = () => new Date().toISOString().split('T')[0];
  const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });

  function showLoading(show) {
    isLoading = show;
    const overlay = $('loadingOverlay');
    if (overlay) overlay.style.display = show ? 'flex' : 'none';
  }

  async function loadData() {
    showLoading(true);
    try {
      const txSnap = await txCol.orderBy('created_at', 'desc').get();
      const txData = txSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      transactions = txData.map(r => ({
        id: r.id,
        name: r.name,
        phone: r.phone || '',
        type: r.type,
        amount: parseFloat(r.amount),
        paid: parseFloat(r.paid),
        remaining: parseFloat(r.remaining),
        date: r.date,
        dueDate: r.due_date,
        note: r.note || '',
        history: r.history || [],
        createdAt: r.created_at
      }));
      updateStats();
      renderDebts();
    } catch(e) {
      console.error('loadData error:', e);
      const isPerm = e && e.code === 'permission-denied';
      $('debtList').innerHTML = `
        <div style="margin:20px 16px;padding:16px;background:#fff3cd;border:1px solid #ffc107;border-radius:10px;font-family:'Inter',sans-serif">
          <div style="font-size:1rem;font-weight:700;margin-bottom:8px">⚠️ ${isPerm ? 'Permiso denegado en Firestore' : 'Error de conexión'}</div>
          ${isPerm ? `<div style="font-size:0.82rem;color:#555;line-height:1.6">
            Revisa las <b>reglas de seguridad</b> de Firestore en tu proyecto Firebase (Firestore Database → Rules).
          </div>` : `<div style="font-size:0.82rem;color:#555">Verifica tu conexión y la configuración de Firebase (firebaseConfig), e inténtalo de nuevo.</div>`}
          <button onclick="loadData()" style="margin-top:12px;padding:8px 16px;background:#1a1a2e;color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.82rem">🔄 Reintentar</button>
        </div>`;
    } finally {
      showLoading(false);
    }
  }

  async function saveTx(tx) {
    const row = {
      id: tx.id,
      name: tx.name,
      phone: tx.phone || null,
      type: tx.type,
      amount: tx.amount,
      paid: tx.paid,
      remaining: tx.remaining,
      date: tx.date,
      due_date: tx.dueDate || null,
      note: tx.note || null,
      history: tx.history || [],
      created_at: tx.createdAt
    };
    try { await txCol.doc(tx.id).set(row); } catch(e) { handleDbError(e); }
  }

  async function updateTx(tx, fullEdit = false) {
    let row;
    if (fullEdit) {
      row = {
        name: tx.name,
        phone: tx.phone || null,
        type: tx.type,
        amount: tx.amount,
        paid: tx.paid,
        remaining: tx.remaining,
        date: tx.date,
        due_date: tx.dueDate || null,
        note: tx.note || null,
        history: tx.history || []
      };
    } else {
      row = {
        paid: tx.paid,
        remaining: tx.remaining,
        history: tx.history || []
      };
    }
    try { await txCol.doc(tx.id).update(row); } catch(e) { handleDbError(e); }
  }

  async function deleteTxFromDB(id) {
    try { await txCol.doc(id).delete(); } catch(e) { handleDbError(e); }
  }

  function showToast(msg, duration=2500) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  function formatDate(d) {
    if (!d) return '—';
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });
  }

  function daysUntil(d) {
    if (!d) return null;
    const diff = Math.ceil((new Date(d + 'T00:00:00') - new Date()) / 86400000);
    return diff;
  }

  // ── TABS ─────────────────────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    $('tab-' + tab).classList.add('active');
    document.querySelectorAll('.tab-btn')[['debts','add','history'].indexOf(tab)].classList.add('active');
    if (tab === 'history') renderHistory();
    if (tab === 'debts')   renderDebts();
  }

  // ── ADD TRANSACTION ──────────────────────────────────────────
  function toggleTypeFields() {
    const t = $('addType').value;
    $('paidRow').style.display = t === 'debt' ? 'grid' : 'none';
  }

  function calcBalance() {
    const total = parseFloat($('addAmount').value) || 0;
    const paid  = parseFloat($('addPaid').value) || 0;
    $('addRemaining').value = fmt(Math.max(0, total - paid));
  }

  async function addTransaction() {
    const name = $('addName').value.trim();
    const amount = parseFloat($('addAmount').value);
    if (!name) { showToast('⚠️ Ingresa el nombre'); return; }
    if (!amount || amount <= 0) { showToast('⚠️ Ingresa el importe'); return; }

    const paid = parseFloat($('addPaid').value) || 0;
    const type = $('addType').value;
    const tx = {
      id: uid(),
      name,
      phone: $('addPhone').value.trim(),
      type,
      amount,
      paid,
      remaining: Math.max(0, amount - paid),
      date: $('addDate').value || today(),
      dueDate: $('addDueDate').value || null,
      note: $('addNote').value.trim(),
      history: paid > 0 ? [{ amount: paid, date: today(), note: 'Pago inicial' }] : [],
      createdAt: new Date().toISOString()
    };

    showLoading(true);
    try {
      await saveTx(tx);
      transactions.unshift(tx);
      updateStats();
      renderDebts();
      ['addName','addPhone','addAmount','addPaid','addRemaining','addDueDate','addNote'].forEach(id => $(id).value = '');
      $('addDate').value = today();
      $('addType').value = 'debt';
      toggleTypeFields();
      showToast(`✅ Operación de ${name} guardada`);
      switchTab('debts');
    } catch(e) {
      console.error('saveTx error:', e); showToast('❌ Error: ' + (e.message || 'desconocido'));
    } finally {
      showLoading(false);
    }
  }

  // ── RENDER DEBTS ─────────────────────────────────────────────
  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    renderDebts();
  }

  function renderDebts() {
    const search = $('searchInput').value.toLowerCase();
    const todayStr = today();

    let list = transactions.filter(tx => {
      if (search && !tx.name.toLowerCase().includes(search)) return false;
      if (currentFilter === 'debt') return tx.remaining > 0 && tx.type === 'debt';
      if (currentFilter === 'overdue') {
        if (!tx.dueDate || tx.remaining <= 0) return false;
        return tx.dueDate < todayStr;
      }
      if (currentFilter === 'paid') return tx.remaining <= 0;
      if (currentFilter === 'service') return tx.type === 'service';
      return true;
    });

    const container = $('debtList');
    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><p>Sin resultados</p></div>`;
      return;
    }

    container.innerHTML = list.map(tx => {
      const isOverdue = tx.dueDate && tx.dueDate < todayStr && tx.remaining > 0;
      const days = daysUntil(tx.dueDate);
      const isPaid = tx.remaining <= 0;
      
      let typeClass = isPaid ? 'paid' : tx.type;
      if (isOverdue) typeClass = 'debt';
      
      let badgeClass, badgeText;
      if (isPaid) { badgeClass = 'badge-paid'; badgeText = '✅ Pagado'; }
      else if (tx.type === 'service') { badgeClass = 'badge-service'; badgeText = '🔧 Servicio'; }
      else if (tx.type === 'digital') { badgeClass = 'badge-digital'; badgeText = '💻 Digital'; }
      else { badgeClass = 'badge-debt'; badgeText = '⏳ Pendiente'; }

      let dueLine = '';
      if (tx.dueDate) {
        if (isOverdue) {
          dueLine = `<span class="overdue-tag">⚠️ Atrasado ${Math.abs(days)} días</span>`;
        } else if (!isPaid && days !== null) {
          dueLine = `<span style="font-size:0.65rem;color:var(--muted);font-family:'Inter',sans-serif">${days > 0 ? `Faltan ${days} días` : '¡Hoy!'}</span>`;
        }
      }

      return `
      <div class="tx-card ${typeClass} ${isOverdue ? 'overdue' : ''}">
        <div class="tx-top">
          <div>
            <div class="tx-name">${tx.name}</div>
            ${tx.phone ? `<div style="font-size:0.72rem;color:var(--muted)">${tx.phone}</div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <span class="tx-type-badge ${badgeClass}">${badgeText}</span>
            ${dueLine}
          </div>
        </div>
        <div class="tx-details">
          <div class="tx-detail-item">
            <span class="key">Importe total</span>
            <span class="val">${fmt(tx.amount)} €</span>
          </div>
          <div class="tx-detail-item">
            <span class="key">Ya pagado</span>
            <span class="val amount-paid">${fmt(tx.paid)} €</span>
          </div>
          <div class="tx-detail-item">
            <span class="key">Pendiente</span>
            <span class="val amount-owed">${fmt(tx.remaining)} €</span>
          </div>
          <div class="tx-detail-item">
            <span class="key">Fecha de operación</span>
            <span class="val">${formatDate(tx.date)}</span>
          </div>
          ${tx.dueDate ? `<div class="tx-detail-item">
            <span class="key">Fecha de vencimiento</span>
            <span class="val" style="color:${isOverdue?'var(--accent)':'inherit'}">${formatDate(tx.dueDate)}</span>
          </div>` : ''}
        </div>
        ${tx.note ? `<div class="tx-note">📝 ${tx.note}</div>` : ''}
        <div class="tx-actions">
          ${!isPaid ? `<button class="btn btn-success" style="font-size:0.75rem;padding:7px 12px" onclick="openPayModal('${tx.id}')">💵 Cobrar</button>` : ''}
          <button class="btn btn-blue" style="font-size:0.75rem;padding:7px 12px" onclick="openEditModal('${tx.id}')">✏️ Editar</button>
          ${tx.phone ? `<a href="tel:${tx.phone}" class="btn btn-ghost" style="font-size:0.75rem;padding:7px 12px;text-decoration:none">📞 Llamar</a>` : ''}
          <button class="btn btn-danger" onclick="deleteTx('${tx.id}')">🗑️ Borrar</button>
        </div>
      </div>`;
    }).join('');
  }

  // ── PAY MODAL ────────────────────────────────────────────────
  function openPayModal(id) {
    const tx = transactions.find(t => t.id === id);
    if (!tx) return;
    $('payTxId').value = id;
    $('payName').value = tx.name;
    $('payOwed').value = fmt(tx.remaining);
    $('payAmount').value = '';
    $('payNote').value = '';
    $('payModal').classList.add('open');
    setTimeout(() => $('payAmount').focus(), 200);
  }

  // ── EDIT MODAL ────────────────────────────────────────────────
  function openEditModal(id) {
    const tx = transactions.find(t => t.id === id);
    if (!tx) return;
    $('editTxId').value = id;
    $('editName').value = tx.name;
    $('editPhone').value = tx.phone || '';
    $('editType').value = tx.type;
    $('editAmount').value = tx.amount;
    $('editPaid').value = tx.paid;
    $('editRemaining').value = fmt(tx.remaining);
    $('editDate').value = tx.date || '';
    $('editDueDate').value = tx.dueDate || '';
    $('editNote').value = tx.note || '';
    $('editModal').classList.add('open');
  }

  function closeEditModal() {
    $('editModal').classList.remove('open');
  }

  function recalcEditRemaining() {
    const amount = parseFloat($('editAmount').value) || 0;
    const paid   = parseFloat($('editPaid').value) || 0;
    $('editRemaining').value = fmt(Math.max(0, amount - paid));
  }

  async function confirmEdit() {
    const id = $('editTxId').value;
    const name = $('editName').value.trim();
    const amount = parseFloat($('editAmount').value);
    if (!name) { showToast('⚠️ Ingresa el nombre'); return; }
    if (!amount || amount <= 0) { showToast('⚠️ Ingresa el importe'); return; }

    const tx = transactions.find(t => t.id === id);
    if (!tx) return;

    const paid = parseFloat($('editPaid').value) || 0;
    tx.name      = name;
    tx.phone     = $('editPhone').value.trim();
    tx.type      = $('editType').value;
    tx.amount    = amount;
    tx.paid      = paid;
    tx.remaining = parseFloat(fmt(Math.max(0, amount - paid)));
    tx.date      = $('editDate').value || today();
    tx.dueDate   = $('editDueDate').value || null;
    tx.note      = $('editNote').value.trim();

    showLoading(true);
    try {
      await updateTx(tx, true);
      updateStats();
      closeEditModal();
      renderDebts();
      showToast(`✅ Operación de ${tx.name} actualizada`);
    } catch(e) {
      showToast('❌ Error al editar');
      console.error(e);
    } finally {
      showLoading(false);
    }
  }

  function closeModal() {
    ['payModal','editModal'].forEach(id => {
      const el = $(id);
      if (el) { el.classList.remove('open'); el.classList.remove('active'); }
    });
  }

  async function confirmPayment() {
    const id = $('payTxId').value;
    const amount = parseFloat($('payAmount').value);
    if (!amount || amount <= 0) { showToast('⚠️ Ingresa el importe'); return; }

    const tx = transactions.find(t => t.id === id);
    if (!tx) return;

    tx.paid = parseFloat(fmt(tx.paid + amount));
    tx.remaining = parseFloat(fmt(Math.max(0, tx.remaining - amount)));
    tx.history = tx.history || [];
    tx.history.push({ amount, date: today(), note: $('payNote').value.trim() || 'Pago' });

    showLoading(true);
    try {
      await updateTx(tx);
      updateStats();
      closeModal();
      renderDebts();
      showToast(`✅ Pago de ${fmt(amount)} € registrado de ${tx.name}`);
    } catch(e) {
      showToast('❌ Error al actualizar');
    } finally {
      showLoading(false);
    }
  }

  async function deleteTx(id) {
    if (!confirm('¿Eliminar esta operación?')) return;
    showLoading(true);
    try {
      await deleteTxFromDB(id);
      transactions = transactions.filter(t => t.id !== id);
      updateStats();
      renderDebts();
      showToast('🗑️ Eliminado');
    } catch(e) {
      showToast('❌ Error al eliminar');
    } finally {
      showLoading(false);
    }
  }

  // ── HISTORY ───────────────────────────────────────────────────
  function renderHistory() {
    const all = [...transactions].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    
    const sumDebt  = transactions.reduce((s,t) => s + (t.remaining || 0), 0);
    const sumPaid  = transactions.reduce((s,t) => s + (t.paid || 0), 0);

    $('sumDebt').textContent  = fmt(sumDebt) + ' €';
    $('sumPaid').textContent  = fmt(sumPaid) + ' €';
    $('sumTotal').textContent = fmt(sumPaid) + ' €';

    const container = $('historyList');
    if (all.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">📜</div><p>Historial vacío</p></div>`;
      return;
    }
    container.innerHTML = all.map(tx => `
      <div class="history-item" style="margin-bottom:8px">
        <div class="hi-left">
          <div class="hi-title">${tx.name}</div>
          <div class="hi-sub">
            ${tx.type === 'digital' ? '💻 Digital' : tx.type === 'service' ? '🔧 Servicio' : '📋 Deuda'} · 
            Pagado: ${fmt(tx.paid)} € ·
            ${tx.remaining > 0 ? `<span style="color:var(--accent)">Faltan ${fmt(tx.remaining)} €</span>` : '<span style="color:var(--green)">✅ Completo</span>'}
          </div>
          ${tx.note ? `<div class="hi-sub">${tx.note.substring(0,40)}${tx.note.length>40?'...':''}</div>` : ''}
        </div>
        <div class="hi-right">
          <div class="hi-amount">${fmt(tx.amount)} €</div>
          <div class="hi-date">${formatDate(tx.date)}</div>
        </div>
      </div>
    `).join('');
  }

  // ── STATS ─────────────────────────────────────────────────────
  function updateStats() {
    const debtCount = transactions.filter(t => t.remaining > 0).length;
    const paidCount = transactions.filter(t => t.remaining <= 0).length;
    const totalOwed = transactions.reduce((s,t) => s + (t.remaining || 0), 0);

    $('statDebt').textContent = debtCount;
    $('statPaid').textContent = paidCount;
    $('headerTotal').textContent = fmt(totalOwed) + ' €';
  }

  // ── INIT ─────────────────────────────────────────────────────
  function init() {
    const now = new Date();
    $('headerDate').textContent = now.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    $('addDate').value = today();
    toggleTypeFields();
    loadData();
  }

  init();
</script>
</body>
</html>
